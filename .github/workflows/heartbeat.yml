# .github/workflows/supabase-heartbeat.yml  (in the daily-facts repo)
# Keeps the daily-facts Supabase project from pausing with one tiny daily read.
# Repo secrets required: DAILY_FACTS_URL, DAILY_FACTS_KEY (publishable or anon key).

name: Supabase heartbeat

on:
  schedule:
    - cron: "17 15 * * *"   # daily, 15:17 UTC (8:17 PDT / 7:17 PST)
  workflow_dispatch:         # "Run workflow" button for manual tests

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping daily-facts
        env:
          SUPABASE_URL: ${{ secrets.DAILY_FACTS_URL }}
          SUPABASE_KEY: ${{ secrets.DAILY_FACTS_KEY }}
        run: |
          # --fail-with-body: any non-2xx response fails the job, so GitHub emails you.
          curl -sS --fail-with-body --retry 3 --retry-delay 10 \
            "$SUPABASE_URL/rest/v1/heartbeat?select=*&limit=1" \
            -H "apikey: $SUPABASE_KEY"
          echo
          echo "daily-facts OK"
